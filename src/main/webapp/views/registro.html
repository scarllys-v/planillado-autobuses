<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Planillado Autobuses</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Gradiente de rojo a naranja (mismo que login) */
            background: linear-gradient(135deg, #dc2626 0%, #ea580c 50%, #f97316 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 450px;
            padding: 40px;
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            /* Gradiente en el texto (mismo que login) */
            background: linear-gradient(135deg, #dc2626 0%, #ea580c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .register-header p {
            color: #666;
            font-size: 14px;
        }

        .bus-icon {
            font-size: 50px;
            text-align: center;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #ea580c;
        }

        .btn-register {
            width: 100%;
            padding: 12px;
            /* Botón naranja/rojo (mismo que login) */
            background: linear-gradient(135deg, #dc2626 0%, #ea580c 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(220, 38, 38, 0.4);
        }

        .message {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .error {
            background: #fee;
            color: #dc2626;
            display: block;
        }

        .success {
            background: #d4edda;
            color: #28a745;
            display: block;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: #ea580c;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        small {
            display: block;
            margin-top: 5px;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="register-container">
    <div class="bus-icon">🚍</div>
    <div class="register-header">
        <h1>Crear Cuenta</h1>
        <p>Regístrate para usar el sistema de transporte</p>
    </div>

    <div id="errorMessage" class="message error" style="display: none;"></div>
    <div id="successMessage" class="message success" style="display: none;"></div>

    <form id="registroForm" action="registro" method="POST">
        <div class="form-group">
            <label> Nombre completo</label>
            <input type="text" name="nombre" placeholder="hedy lamarr" required>
        </div>

        <div class="form-group">
            <label> Email</label>
            <input type="email" name="email" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="form-group">
            <label> Contraseña</label>
            <input type="password" name="password" placeholder="********" required>
        </div>

        <div class="form-group">
            <label> Confirmar contraseña</label>
            <input type="password" name="confirm_password" placeholder="********" required>
        </div>

        <div class="form-group">
            <label> Tipo de cuenta</label>
            <select name="rol">
                <option value="usuario"> Usuario normal</option>
                <option value="conductor"> Conductor</option>
            </select>
            <small>⚠ Los administradores solo pueden ser creados por otro administrador</small>
        </div>

        <button type="submit" class="btn-register">Registrarse</button>
    </form>

    <div class="login-link">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
    </div>
</div>

<script>
    const form = document.getElementById('registroForm');
    const errorDiv = document.getElementById('errorMessage');
    const successDiv = document.getElementById('successMessage');

    // Mostrar mensajes desde la URL (por si viene del servlet)
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error');
    const success = urlParams.get('success');

    if (error) {
        errorDiv.textContent = decodeURIComponent(error);
        errorDiv.style.display = 'block';
    }

    if (success) {
        successDiv.textContent = decodeURIComponent(success);
        successDiv.style.display = 'block';
    }

    form.addEventListener('submit', function(event) {
        const password = document.querySelector('input[name="password"]').value;
        const confirm = document.querySelector('input[name="confirm_password"]').value;

        if (password !== confirm) {
            event.preventDefault();
            errorDiv.textContent = 'Las contraseñas no coinciden';
            errorDiv.style.display = 'block';
            return;
        }

        if (password.length < 4) {
            event.preventDefault();
            errorDiv.textContent = 'La contraseña debe tener al menos 4 caracteres';
            errorDiv.style.display = 'block';
            return;
        }
    });
</script>
</body>
</html>
